name: Daily health from Apple Health

# For athletes without Garmin (Oura, Ultrahuman, Apple Watch). An iPhone Shortcut sends the last
# few days of sleep, HRV, resting heart rate, steps and weight as a repository_dispatch event of
# type apple_health, with a fine-grained token limited to this repository.
# Setup: coach/ops/APPLE-HEALTH-SHORTCUT.md. Script: scripts/apple_health.py.
on:
  repository_dispatch:
    types: [apple_health]

permissions:
  contents: write

concurrency:
  group: garmin-pull   # one queue for every writer of data/, so none race on summary.csv
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge daily health
        env:
          # passed as data, never interpolated into the shell
          APPLE_HEALTH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python scripts/apple_health.py

      - name: Commit changes
        run: |
          git config user.name "coach-data-bot"
          git config user.email "coach-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Apple Health send $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q
          fi
