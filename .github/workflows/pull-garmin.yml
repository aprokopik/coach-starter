name: Pull Garmin data

on:
  workflow_dispatch:
    inputs:
      extra_days_back:
        description: "Backfill this many extra days (0 = today and yesterday only)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: garmin-pull
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          # Start from the branch tip when the job starts, not the commit that queued it: a run that waited
          # behind another (concurrency group) would otherwise redo its work and conflict with it (Nov 20, 2026).
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet "garminconnect==0.3.17" curl_cffi cryptography

      - name: Pull today and yesterday
        id: pull
        env:
          GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKEN_KEY }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          EXTRA_DAYS_BACK: ${{ github.event.inputs.extra_days_back }}
        run: |
          set +e
          python scripts/pull_garmin.py
          echo "rc=$?" >> "$GITHUB_OUTPUT"

      - name: Day forecast (only when the profile names a town; never fails the pull)
        run: python scripts/pull_weather.py || true

      - name: Commit changes
        run: |
          git config user.name "garmin-pull-bot"
          git config user.email "garmin-pull-bot@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Garmin pull $(date -u +%Y-%m-%dT%H:%MZ)"
            # Newer data wins a same-file conflict (each run rewrites whole files from the source);
            # retry if another writer pushed in between.
            for i in 1 2 3; do
              git pull -q --rebase -X theirs && git push -q && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            exit 1
          fi

      - name: Fail visibly if the pull failed
        if: steps.pull.outputs.rc != '0'
        run: |
          echo "Pull failed with code ${{ steps.pull.outputs.rc }}. See data/status/last_run.json."
          exit 1
