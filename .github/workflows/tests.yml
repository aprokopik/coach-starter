name: Coach tests

# Runs the deterministic coach tests on every pull request and on every push to main,
# so a tools change cannot merge on a red suite (RUNBOOK, Tests).
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - "coach/tools/**"
      - "coach/tests/**"
      - "coach/engine/schemas.json"
      - ".github/workflows/tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and regression tests
        run: python -m unittest discover -s coach/tests -v
