name: Daily health from Apple Health

# For athletes without Garmin (Oura, Ultrahuman, Apple Watch). An iPhone Shortcut sends the last
# few days of sleep, HRV, resting heart rate, steps and weight as a repository_dispatch event of
# type apple_health, with a fine-grained token limited to this repository.
# Setup: coach/ops/APPLE-HEALTH-SHORTCUT.md. Script: scripts/apple_health.py.
on:
  repository_dispatch:
    types: [apple_health]

permissions:
  contents: write

concurrency:
  group: garmin-pull   # one queue for every writer of data/, so none race on summary.csv
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # Start from the branch tip when the job starts, not the commit that queued it: a run that waited
          # behind another (concurrency group) would otherwise redo its work and conflict with it (Nov 20, 2026).
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Merge daily health
        env:
          # passed as data, never interpolated into the shell
          APPLE_HEALTH_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: python scripts/apple_health.py

      - name: Commit changes
        run: |
          git config user.name "coach-data-bot"
          git config user.email "coach-data-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Apple Health send $(date -u +%Y-%m-%dT%H:%MZ)"
            # Newer data wins a same-file conflict (each run rewrites whole files from the source);
            # retry if another writer pushed in between.
            for i in 1 2 3; do
              git pull -q --rebase -X theirs && git push -q && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            exit 1
          fi
