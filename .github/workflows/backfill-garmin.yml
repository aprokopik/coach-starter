name: Backfill Garmin history

# Manual only. Pulls older activities and daily health files into the same layout the
# daily pull writes. Each run stops itself after about 45 minutes and commits what it got;
# run it again until the summary says "done" or "start of history". Days already in the
# repo are skipped, so re-runs never repeat or overwrite work.
on:
  workflow_dispatch:
    inputs:
      activities_from:
        description: "Activities from (YYYY-MM-DD). Blank = everything Garmin has"
        required: false
        default: ""
      daily_from:
        description: "Daily health (sleep, HRV, resting HR) from (YYYY-MM-DD). Blank = 2 years back"
        required: false
        default: ""
      to:
        description: "Up to (YYYY-MM-DD). Blank = yesterday"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: garmin-pull   # shared with the daily pull so the two never write at once
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet "garminconnect==0.3.17" curl_cffi cryptography

      - name: Backfill
        id: pull
        env:
          GARMIN_TOKEN_KEY: ${{ secrets.GARMIN_TOKEN_KEY }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          BACKFILL_ACTIVITIES_FROM: ${{ github.event.inputs.activities_from }}
          BACKFILL_DAILY_FROM: ${{ github.event.inputs.daily_from }}
          BACKFILL_TO: ${{ github.event.inputs.to }}
          BACKFILL_MINUTES: "45"
        run: |
          set +e
          python scripts/backfill_garmin.py | tee backfill-summary.txt
          echo "rc=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          { echo '```'; cat backfill-summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit changes
        run: |
          git config user.name "garmin-pull-bot"
          git config user.email "garmin-pull-bot@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Garmin backfill $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull -q --rebase && git push -q
          fi

      - name: Fail visibly if the backfill failed
        if: steps.pull.outputs.rc != '0'
        run: |
          echo "Backfill failed with code ${{ steps.pull.outputs.rc }}. See state/backfill_progress.json."
          exit 1
