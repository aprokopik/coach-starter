name: Pull Strava workouts

# Workouts for athletes without Garmin: scripts/pull_strava.py reads recent Strava activities
# into data/activities.csv. Needs the secrets STRAVA_CLIENT_ID, STRAVA_CLIENT_SECRET and
# STRAVA_REFRESH_TOKEN (scripts/setup_strava.py); without them it does nothing.
# The schedule is added by setup/personalize.py for athletes who use Strava; until then the
# workflow runs only by hand or from the morning check-in's dispatch.
on:
  workflow_dispatch:
    inputs:
      extra_days_back:
        description: "Look back this many days (blank = 2)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: garmin-pull   # one queue for every writer of data/
  cancel-in-progress: false

jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Start from the branch tip when the job starts, not the commit that queued it: a run that waited
          # behind another (concurrency group) would otherwise redo its work and conflict with it (Nov 20, 2026).
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --quiet cryptography

      - name: Pull recent workouts
        env:
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
          EXTRA_DAYS_BACK: ${{ github.event.inputs.extra_days_back }}
        run: python scripts/pull_strava.py

      - name: Commit changes
        run: |
          git config user.name "coach-data-bot"
          git config user.email "coach-data-bot@users.noreply.github.com"
          git add data state
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -q -m "Strava pull $(date -u +%Y-%m-%dT%H:%MZ)"
            # Newer data wins a same-file conflict (each run rewrites whole files from the source);
            # retry if another writer pushed in between.
            for i in 1 2 3; do
              git pull -q --rebase -X theirs && git push -q && exit 0
              git rebase --abort 2>/dev/null || true
              sleep $((i * 5))
            done
            exit 1
          fi
